<div class="container">
  <h1>Consulta de clientes</h1>

  <div class="search-row">
    <input
      id="nameFilter"
      type="text"
      [(ngModel)]="nameFilter"
      placeholder="Nombre del cliente"
      (keydown.enter)="onSearch()"
    />
    <div class="buttons">
      <button type="button" (click)="onSearch()">Buscar</button>
      <button type="button" (click)="onClear()" class="secondary">Limpiar</button>
    </div>
  </div>

  @if (loading) {
    <p>Cargando...</p>
  }

  @if (!loading && clients.length) {
    <table>
      <thead>
        <tr>
          <th>País</th>
          <th>Id</th>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Categoría</th>
        </tr>
      </thead>
      <tbody>
        @for (c of clients; track c) {
          <tr>
            <td>{{ c.country }}</td>
            <td>{{ c.id }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.phone }}</td>
            <td>{{ c.category }}</td>
          </tr>
        }
      </tbody>
    </table>
  }

  @if (!loading && !clients.length) {
    <p>No se encontraron clientes.</p>
  }
</div>
